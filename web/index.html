    <!-- Clay shadow CSS layer -->
    <style>
      @layer base {
        html, body { margin: 0; padding: 0; }
        body { overscroll-behavior: none; }
        main > :first-child { margin-top: 0 !important; }
        main > :last-child { margin-bottom: 0 !important; }
      }
      ::-webkit-scrollbar { display: none; }
      .clay-pill {
        box-shadow: 6px 6px 14px rgba(166,153,142,0.35),
                    -4px -4px 10px rgba(255,255,255,0.85),
                    inset 1px 1px 2px rgba(255,255,255,0.8),
                    inset -1px -1px 2px rgba(93,0,25,0.06);
      }
      .clay-pill-amber {
        box-shadow: 6px 6px 14px rgba(126,87,0,0.25),
                    -4px -4px 10px rgba(255,255,255,0.85),
                    inset 1px 1px 2px rgba(255,255,255,0.7),
                    inset -1px -1px 2px rgba(113,77,0,0.15);
      }
      .clay-card {
        box-shadow: 14px 14px 28px rgba(166,153,142,0.4),
                    -10px -10px 24px rgba(255,255,255,0.95),
                    inset 3px 3px 5px rgba(255,255,255,0.7),
